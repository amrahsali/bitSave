name: bitSave
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.9
  flutter_svg: ^2.3.0
  rxdart: ^0.28.0
  stacked_services: ^1.6.0
  stacked: ^3.5.0
  dio: ^4.0.6
  logger: ^2.7.0
  sembast: ^3.8.7
  pretty_dio_logger: ^1.2.0-beta-1
  lottie: ^3.3.3
  smooth_page_indicator: ^1.2.1
  animate_do: ^4.2.0
  intl_phone_field: ^3.2.0
  google_fonts: ^6.3.3
  pin_code_fields: ^8.0.1
  dropdown_button2: ^2.3.9
  time_range_picker: ^2.3.1
  flutter_picker: ^2.1.0
  time_picker_spinner: ^1.0.2
  date_picker_plus: ^4.2.0
  intl: ^0.20.2
  dots_indicator: ^4.0.1
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  device_info_plus: ^9.1.2
  package_info_plus: ^8.3.1
  async: ^2.13.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  firebase_in_app_messaging: ^0.9.2+4
  firebase_analytics: ^12.4.3
  firebase_crashlytics: ^5.2.4
  firebase_auth: ^6.5.3
  cloud_functions: ^6.3.3
  # flutter_breez_liquid:
  #   git:
  #     url: https://github.com/breez/breez-sdk-liquid-flutter
  #     ref: v0.8.3
  flutter_secure_storage: ^9.2.4
  bip39: ^1.0.6
  cloud_firestore: ^6.6.0
  flutter_rust_bridge: ^2.12.0
  flutter_local_notifications: ^17.2.4
  flutter_plugin_android_lifecycle: ^2.0.35

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  build_runner: ^2.15.0
  stacked_generator: ^1.6.2

flutter_native_splash:
  color: "#432E9D"
  android: true
  ios: true
  web: false
  image: "assets/images/bitsavelogo.png"
  fullscreen: true

dependency_overrides:
  win32: ^5.14.0
  path_provider: ^2.1.5
  path_provider_android: ^2.2.9
  path_provider_foundation: ^2.4.0
  image_picker: ^1.1.2
  image_picker_android: ^0.8.12+12
  image_picker_ios: ^0.8.9
  flutter_local_notifications: ^17.2.2
  flutter_timezone: ^2.1.0
  device_info_plus: ^9.1.2
  package_info_plus: ^8.0.2
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/bitsaveicon.png"
  android_adaptive_icon:
    foreground_image: "assets/images/bitsaveicon.png"
    background_color: "#000000"